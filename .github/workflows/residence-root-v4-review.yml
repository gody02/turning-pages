name: Residence root-v4 browser freeze evidence

on:
  workflow_dispatch:
  push:
    branches: [ci/residence-root-v4-freeze-review]

permissions:
  contents: read

jobs:
  validation:
    name: Root-v4 regression, types and content integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers=1
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
  persistence:
    name: Root-v4 ${{ matrix.browser }} persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run unchanged full root-v4 persistence assertions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-evidence/results.json
        run: |
          mkdir -p browser-evidence
          set -o pipefail
          pnpm exec playwright test --config playwright.persistence.config.ts --project=${{ matrix.browser }} --reporter=line,json 2>&1 | tee browser-evidence/profile.log
      - name: Retain evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residence-root-v4-${{ matrix.browser }}
          path: |
            browser-evidence/
            test-results/
          if-no-files-found: warn
          retention-days: 14
