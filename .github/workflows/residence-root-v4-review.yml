name: Residence root-v4 browser freeze evidence

on:
  workflow_dispatch:
  push:
    branches: [ci/residence-root-v4-freeze-review]

permissions:
  contents: read

jobs:
  validation:
    name: Root-v4 regression, types and content integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
  persistence:
    name: Root-v4 ${{ matrix.browser }} persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Preserve the historical build-only Class C probe on its exact source.
      # The actual installed route is tested separately below, with no substitution.
      - name: Check out immutable Class C baseline for retained diagnostic coverage
        uses: actions/checkout@v4
        with:
          ref: f30b71b9014b3feb26d19fc763107521ee694584
          path: historical-class-c
      - name: Review actual built fresh New World Class C evidence
        working-directory: historical-class-c
        env:
          FRESH_GENERATION_BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p browser-evidence
          export GITHUB_SHA=f30b71b9014b3feb26d19fc763107521ee694584
          node research/fresh-new-game-latency/prepare-profile.mjs
          set -o pipefail
          node research/fresh-new-game-latency/review-profile.mjs 2>&1 | tee browser-evidence/fresh-generation.log
      - name: Build explicit startup-only Worker acceptance bundle
        run: node scripts/build-country-start-v3-worker-browser.mjs
      - name: Run unchanged full root-v4 persistence assertions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-evidence/results.json
        run: |
          mkdir -p browser-evidence
          set -o pipefail
          pnpm exec playwright test --config playwright.persistence.config.ts --project=${{ matrix.browser }} --reporter=line,json 2>&1 | tee browser-evidence/profile.log
      - name: Publish explicit v3 measurement diagnostics
        if: always()
        run: node scripts/report-country-start-v3-browser-evidence.mjs browser-evidence/results.json
      - name: Build actual application content-handoff acceptance bundle
        run: node scripts/build-application-content-browser.mjs
      - name: Run actual built LifeApp content-handoff and failure-retry assertions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-evidence/application-content.json
        run: |
          set -o pipefail
          pnpm exec playwright test --config playwright.application-content.config.ts --project=${{ matrix.browser }} --reporter=line,json 2>&1 | tee browser-evidence/application-content.log
      - name: Publish actual application-content diagnostics
        if: always()
        run: node scripts/report-application-content-evidence.mjs browser-evidence/application-content.json
      - name: Publish actual production New Game Class C and lifecycle evidence
        if: always()
        run: node research/production-new-game-v3/report-browser.mjs browser-evidence/application-content.json
      - name: Retain evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residence-root-v4-${{ matrix.browser }}
          path: |
            browser-evidence/
            research/fresh-new-game-latency/evidence-*.json
            historical-class-c/browser-evidence/
            historical-class-c/research/fresh-new-game-latency/evidence-*.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
